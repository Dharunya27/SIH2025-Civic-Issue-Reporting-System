# Database
spring.datasource.url=jdbc:mysql://localhost:3306/civic_issue_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=dk1306
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JWT Configuration
# ===============================
# Use environment variable in production instead of hardcoding
jwt.secret=${JWT_SECRET:yourSuperSecretKeyForJWTGenerationAtLeast256BitsLong}
jwt.expiration=86400000

# Server Configuration
server.port=8080
spring.application.name=civicissue
# Add these at the end of your application.properties
# Priority threshold in days
issue.priority.threshold-days=7

# SLA deadline in days
issue.sla.deadline-days=15